name: Deploy

on:
  push:
    # "main" is the release branch. It does not exist yet, so "development" is
    # included too — otherwise this workflow could never fire — and
    # workflow_dispatch allows a manual deploy. Remove "development" once a
    # main branch exists and deploys should only follow releases.
    branches: [main, development]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (backend)
        env:
          HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_BACKEND_DEPLOY_HOOK is not set — skipping backend deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"

  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (resume-worker)
        env:
          HOOK: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_WORKER_DEPLOY_HOOK is not set — skipping worker deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"

  deploy-ml-service:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (ml-service)
        env:
          HOOK: ${{ secrets.RENDER_ML_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_ML_DEPLOY_HOOK is not set — skipping ml-service deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (frontend)
        env:
          HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_FRONTEND_DEPLOY_HOOK is not set — skipping frontend deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
