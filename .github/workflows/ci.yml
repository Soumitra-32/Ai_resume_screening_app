name: CI

on:
  push:
    # "development" is the branch this repository actually works on and "main"
    # is the release branch. The previous config listened on "main"/"develop",
    # and since no "develop" branch exists CI never ran at all.
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # `npm run build` is `tsc`, so this typechecks the whole service as well.
      # There is no backend integration suite yet (it would need Mongo + Redis);
      # see the Testing section of README.md.
      - name: Typecheck and build
        run: npm run build

  ml-service-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ML
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ML/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run API tests
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker-build-check:
    runs-on: ubuntu-latest
    needs: [backend-build, ml-service-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t resume-backend ./backend
      - name: Build ml-service image
        run: docker build -t resume-ml ./ML
      - name: Build frontend image
        run: docker build -t resume-frontend ./frontend
