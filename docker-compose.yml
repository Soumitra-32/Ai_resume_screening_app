version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: resume_screener_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER not set}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD not set}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-resume_screener}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: resume_screener_redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ML
      dockerfile: Dockerfile
    container_name: resume_screener_ml
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume_screener_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://${MONGO_USER:?MONGO_USER not set}:${MONGO_PASSWORD:?MONGO_PASSWORD not set}@mongo:27017/${MONGO_DB:-resume_screener}?authSource=admin
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
    ports:
      - "5000:5000"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  resume-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume_screener_worker
    restart: unless-stopped
    command: npm run worker
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://${MONGO_USER:?MONGO_USER not set}:${MONGO_PASSWORD:?MONGO_PASSWORD not set}@mongo:27017/${MONGO_DB:-resume_screener}?authSource=admin
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resume_screener_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  uploads-data:
  redis-data: